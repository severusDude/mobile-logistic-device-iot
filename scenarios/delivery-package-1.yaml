name: "Delivery package 1"
version: 1
author: "Lutfi Fajar"

steps:
  - wait-serial: "[HB] Heartbeat published. Uptime: 0s"
  - delay: 500ms
  - write-serial: "SCENARIO DELIVERED\n"
  - wait-serial: "Next RFID scan context armed: delivered"
  - set-control:
      part-id: pn532
      control: card1
      value: 1
  - wait-serial: "[SCENARIO] EPC=LOG-PKG-20260506-JKTWH-00001"
  - wait-serial: "[SCENARIO] CTX=delivered"
  - wait-serial: "[SCENARIO] ACTIVE=0"
