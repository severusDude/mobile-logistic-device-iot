name: "Pickup two packages"
version: 1
author: "Lutfi Fajar"

steps:
  - wait-serial: "Setup complete"
  - write-serial: "SCENARIO PICKUP\n"
  - wait-serial: "Next RFID scan context armed: pickup"
  - set-control:
      part-id: pn532
      control: card1
      value: 1
  - wait-serial: "[SCENARIO] EPC=LOG-PKG-20260506-JKTWH-00001"
  - wait-serial: "[SCENARIO] ACTIVE=1"
  - set-control:
      part-id: pn532
      control: card1
      value: 0
  - set-control:
      part-id: pn532
      control: reset
      value: 1
  - delay: 200ms
  - set-control:
      part-id: pn532
      control: reset
      value: 0
  - write-serial: "SCENARIO PICKUP\n"
  - wait-serial: "Next RFID scan context armed: pickup"
  - set-control:
      part-id: pn532
      control: card2
      value: 1
  - wait-serial: "[SCENARIO] EPC=LOG-PKG-20260506-JKTWH-00002"
  - wait-serial: "[SCENARIO] ACTIVE=2"
