; ============================================================
; PlatformIO Configuration — Mobile IoT Device
; GPS Logistic Package Tracking System
; Device Type : Mobile (Truck / Delivery Van)
; MCU         : ESP32 (generic)
; Connectivity: WiFi → MQTT over TCP/IP
; GPS         : NEO-6M / NEO-8M (UART)
; RFID        : PN532 (I2C mode)
; Display     : None (Serial monitor only)
; Simulation  : Wokwi
; ============================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; ── Libraries ───────────────────────────────────────────────
; PubSubClient     : MQTT client over WiFi TCP
; TinyGPSPlus      : NMEA GPS sentence parser for NEO-6M/8M
; Adafruit_PN532   : PN532 NFC/RFID reader (I2C mode)
; ArduinoJson      : JSON payload serialization / deserialization
lib_deps = 
	https://github.com/knolleary/pubsubclient.git
	https://github.com/miguelbalboa/rfid.git
	https://github.com/mikalhart/TinyGPSPlus.git
	bblanchon/ArduinoJson@^7.2.2
	adafruit/Adafruit SSD1306@^2.5.16
	adafruit/Adafruit GFX Library@^1.12.6
	adafruit/Adafruit PN532@^1.3.4

; ── Build flags ─────────────────────────────────────────────
build_flags =
    -DDEVICE_TYPE=\"mobile\"
    -DDEVICE_ID=\"DEV-TRUCK-001\"
    -DFACILITY_ID=\"jkt-wh-01\"
    -DLOCATION_NAME=\"Jakarta\ Warehouse\ -\ Truck\ 01\"
    -DMQTT_BROKER=\"broker.hivemq.com\"
    -DMQTT_PORT=1883
    -DMQTT_USER=\"logistic_device\"
    -DMQTT_PASS=\"secret\"
    -DWIFI_SSID=\"Wokwi-GUEST\"
    -DWIFI_PASS=\"\"
    -DGPS_BAUD=9600
    -DGPS_RX_PIN=3
    -DGPS_TX_PIN=1
    -DRFID_SDA_PIN=21
    -DRFID_SCL_PIN=22
    -DTELEMETRY_INTERVAL_MS=5000
    -DHEARTBEAT_INTERVAL_MS=60000
    -DRFID_COOLDOWN_MS=30000
    -DSERIAL_BAUD=115200
 
; ── Serial monitor ──────────────────────────────────────────
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder, log2file